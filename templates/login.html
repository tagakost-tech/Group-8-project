<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Sign in · Omega Outreach Agent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app/app.css') }}">
</head>
<body class="signin-page">
  <main class="signin">
    <div class="brand signin-brand">
      <span class="brand-mark" aria-hidden="true">Ω</span>
      <span class="brand-text"><strong>Omega</strong><small>Outreach Agent</small></span>
    </div>
    <h1>Sign in</h1>
    <p class="row-sub">Every email the agent proposes waits here for a person.</p>
    {% if error %}<p class="signin-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="signin-form">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field"><span>Name</span>
        <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label class="field"><span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
